
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Enterprise | Датчики</title>

    <link rel="stylesheet" href="/static/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div id="sidebar-container"></div>

    <header class="header">
        <div>
            <h1>Моніторинг датчиків</h1>
            <p>Поточні показники інфраструктури підприємства</p>
        </div>
    </header>

    <main class="container">

        <section class="section">
            <h2>Поточні показники</h2>

            <div class="sensor-grid">

                <div class="sensor-card">
                    <span>Температура</span>
                    <strong id="temperature">--</strong>
                    <small>°C</small>
                </div>

                <div class="sensor-card">
                    <span>Вологість</span>
                    <strong id="humidity">--</strong>
                    <small>%</small>
                </div>

                <div class="sensor-card">
                    <span>Рівень газу</span>
                    <strong id="gas">--</strong>
                    <small>ppm</small>
                </div>

                <div class="sensor-card">
                    <span>Освітленість</span>
                    <strong id="light">--</strong>
                    <small>lux</small>
                </div>

                <div class="sensor-card">
                    <span>Виявлення руху</span>
                    <strong id="motion">--</strong>
                    <small>стан</small>
                </div>

            </div>
        </section>

        <section class="section">
            <h2>Графік температури</h2>

            <div class="chart-container">
                <canvas id="temperature-chart"></canvas>
            </div>
        </section>

        <p id="last-update">
            Очікування даних...
        </p>

        <footer>
            Smart Enterprise Infrastructure Server
        </footer>

    </main>

    <script src="/static/menu.js"></script>
    <script src="/static/api.js"></script>
    <script src="/static/sensors.js"></script>

</body>
</html>
