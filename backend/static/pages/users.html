
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Enterprise | Користувачі</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div id="sidebar-container"></div>

    <header class="header">
        <div>
            <h1>Керування користувачами</h1>
            <p>Створення облікових записів та налаштування прав доступу</p>
        </div>
    </header>

    <main class="container">

        <section class="section">

            <h2>Створити користувача</h2>

            <form id="user-create-form" class="user-form">

                <div class="form-group">
                    <label for="new-username">Логін</label>
                    <input
                        type="text"
                        id="new-username"
                        minlength="3"
                        maxlength="100"
                        placeholder="Введіть логін"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="new-password">Пароль</label>
                    <input
                        type="password"
                        id="new-password"
                        minlength="8"
                        maxlength="128"
                        placeholder="Мінімум 8 символів"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="new-role">Роль</label>
                    <select id="new-role">
                        <option value="user">Користувач</option>
                        <option value="admin">Адміністратор</option>
                    </select>
                </div>

                <button type="submit">Створити користувача</button>

            </form>

            <p id="create-message"></p>

        </section>


        <section class="section">

            <h2>Зареєстровані користувачі</h2>

            <div class="table-container">

                <table class="data-table" id="users-table">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Логін</th>
                            <th>Роль</th>
                            <th>Статус</th>
                            <th>Дата створення</th>
                            <th>Дії</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td colspan="6">Завантаження...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

            <p id="users-message"></p>

        </section>

        <footer>
            Smart Enterprise Infrastructure Server
        </footer>

    </main>

    <script src="/static/api.js"></script>
    <script src="/static/menu.js"></script>
    <script src="/static/users.js"></script>

</body>
</html>
